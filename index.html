<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <title>ЧудоБот - Логистика</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #e9ebef;
      --bg-soft: #f4f5f7;
      --surface: rgba(255, 255, 255, 0.78);
      --surface-solid: #ffffff;
      --glass: rgba(255, 255, 255, 0.45);
      --glass-edge: rgba(255, 255, 255, 0.85);
      --ink: #111114;
      --ink-soft: #5c5f6a;
      --line: rgba(17, 17, 20, 0.08);
      --line-strong: rgba(17, 17, 20, 0.14);
      --accent: #111114;
      --accent-dim: rgba(17, 17, 20, 0.06);
      --gold: #8a6d1d;
      --danger: #d64545;
      --danger-dim: rgba(214, 69, 69, 0.1);
      --warning: #c48a12;
      --ok: #1f9d5a;
      --radius: 24px;
      --radius-sm: 16px;
      --shadow: 0 10px 30px rgba(20, 24, 33, 0.08), 0 2px 8px rgba(20, 24, 33, 0.04);
      --shadow-soft: 0 6px 18px rgba(20, 24, 33, 0.06);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
      --safe-top: env(safe-area-inset-top, 0px);
      --header-h: 64px;
      --cross: rgba(17, 17, 20, 0.06);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      font-family: "Manrope", sans-serif;
      background: var(--bg);
      color: var(--ink);
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background:
        radial-gradient(ellipse 90% 55% at 50% -8%, #ffffff 0%, transparent 60%),
        radial-gradient(ellipse 70% 40% at 100% 20%, rgba(255,255,255,0.7), transparent 50%),
        linear-gradient(180deg, #eceef2 0%, #e4e6eb 100%);
      overflow-x: hidden;
    }

    body.stage-lock {
      overflow: hidden !important;
      touch-action: none;
      overscroll-behavior: none;
      position: fixed;
      width: 100%;
      height: 100%;
    }

    button, input, select, textarea { font: inherit; color: inherit; }

    .app {
      max-width: 520px;
      margin: 0 auto;
      min-height: 100%;
      padding: 12px 14px calc(100px + var(--safe-bottom));
    }

    .header {
      position: sticky;
      top: 10px;
      z-index: 20;
      height: var(--header-h);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 8px 10px 8px 14px;
      background: var(--surface);
      backdrop-filter: blur(18px) saturate(1.2);
      -webkit-backdrop-filter: blur(18px) saturate(1.2);
      border: 1px solid var(--glass-edge);
      border-radius: 22px;
      box-shadow: var(--shadow-soft);
      margin-bottom: 14px;
      animation: riseIn 0.45s ease both;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
    }

    .brand-mark {
      width: 36px;
      height: 36px;
      border-radius: 11px;
      background: var(--ink);
      color: #fff;
      display: grid;
      place-items: center;
      flex-shrink: 0;
      box-shadow: 0 6px 14px rgba(0,0,0,0.18);
    }

    .brand-mark svg { width: 16px; height: 16px; }

    .header h1 {
      font-size: 16px;
      font-weight: 800;
      letter-spacing: -0.02em;
      color: var(--ink);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .header h1 span {
      color: var(--ink-soft);
      font-weight: 600;
      font-size: 13px;
      margin-left: 4px;
    }

    .icon-btn {
      width: 42px;
      height: 42px;
      border: 1px solid var(--line);
      border-radius: 14px;
      background: rgba(255,255,255,0.7);
      color: var(--ink);
      display: grid;
      place-items: center;
      cursor: pointer;
      transition: transform 0.15s, background 0.15s;
    }

    .icon-btn:active { transform: scale(0.96); background: #fff; }
    .icon-btn svg { width: 18px; height: 18px; }

    .stats {
      display: grid;
      gap: 12px;
      margin-bottom: 14px;
      animation: riseIn 0.5s ease 0.05s both;
    }

    .stats-total {
      position: relative;
      overflow: hidden;
      background: var(--surface-solid);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 18px 18px 16px;
      box-shadow: var(--shadow);
      min-height: 118px;
    }

    .stats-total::before {
      content: "";
      position: absolute;
      inset: 18px;
      background:
        linear-gradient(var(--cross) 1px, transparent 1px) 0 50% / 100% 18px,
        linear-gradient(90deg, var(--cross) 1px, transparent 1px) 50% 0 / 18px 100%;
      opacity: 0.7;
      pointer-events: none;
      border-radius: 14px;
    }

    .stats-total .label {
      position: relative;
      color: var(--ink-soft);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.04em;
      text-transform: lowercase;
      margin-bottom: 8px;
    }

    .stats-total .value {
      position: relative;
      font-size: 30px;
      font-weight: 800;
      letter-spacing: -0.03em;
      color: var(--ink);
      line-height: 1.05;
    }

    .stats-total .sub {
      position: relative;
      margin-top: 10px;
      font-size: 12px;
      color: var(--ink-soft);
      font-weight: 600;
    }

    .stats-total .sub strong { color: var(--ink); font-weight: 800; }

    .loc-grid {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 8px;
    }

    .loc-stat {
      position: relative;
      overflow: hidden;
      background: var(--surface-solid);
      border: 1px solid var(--line);
      border-radius: 18px;
      padding: 12px 10px;
      box-shadow: var(--shadow-soft);
      min-height: 88px;
    }

    .loc-stat::before {
      content: "";
      position: absolute;
      inset: 10px;
      background:
        linear-gradient(var(--cross) 1px, transparent 1px) 0 50% / 100% 14px,
        linear-gradient(90deg, var(--cross) 1px, transparent 1px) 50% 0 / 14px 100%;
      opacity: 0.55;
      pointer-events: none;
      border-radius: 10px;
    }

    .loc-stat .name {
      position: relative;
      font-size: 10px;
      font-weight: 700;
      color: var(--ink-soft);
      margin-bottom: 8px;
      letter-spacing: 0.02em;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .loc-stat .kg {
      position: relative;
      font-size: 15px;
      font-weight: 800;
      color: var(--ink);
      letter-spacing: -0.02em;
    }

    .loc-stat .rub {
      position: relative;
      font-size: 11px;
      font-weight: 700;
      color: var(--ink-soft);
      margin-top: 4px;
    }

    .toolbar {
      margin-bottom: 12px;
      animation: riseIn 0.5s ease 0.08s both;
    }

    .chips {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .chip {
      border: 1px solid var(--line);
      background: rgba(255,255,255,0.7);
      color: var(--ink-soft);
      border-radius: 14px;
      padding: 8px 12px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.15s;
      backdrop-filter: blur(8px);
    }

    .chip.active {
      background: var(--ink);
      border-color: var(--ink);
      color: #fff;
      box-shadow: 0 8px 16px rgba(0,0,0,0.12);
    }

    .list {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      animation: riseIn 0.55s ease 0.1s both;
    }

    .empty {
      grid-column: 1 / -1;
      text-align: center;
      padding: 48px 20px;
      color: var(--ink-soft);
      border: 1px dashed var(--line-strong);
      border-radius: var(--radius);
      background: rgba(255,255,255,0.55);
      font-weight: 700;
    }

    .empty strong {
      display: block;
      color: var(--ink);
      margin-bottom: 4px;
      font-weight: 800;
    }

    .card {
      position: relative;
      aspect-ratio: 1;
      background: var(--surface-solid);
      border: 1px solid var(--line);
      border-radius: 22px;
      padding: 12px;
      box-shadow: var(--shadow);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      animation: riseIn 0.4s ease both;
      transition: transform 0.18s ease, box-shadow 0.18s ease;
    }

    .card:active {
      transform: scale(0.985);
    }

    .card::before {
      content: "";
      position: absolute;
      inset: 14px;
      background:
        linear-gradient(var(--cross) 1px, transparent 1px) 0 50% / 100% 16px,
        linear-gradient(90deg, var(--cross) 1px, transparent 1px) 50% 0 / 16px 100%;
      opacity: 0.65;
      pointer-events: none;
      border-radius: 12px;
    }

    @keyframes riseIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: none; }
    }

    .card-tag {
      position: relative;
      z-index: 2;
      font-size: 10px;
      font-weight: 700;
      color: var(--ink-soft);
      letter-spacing: 0.01em;
      align-self: flex-start;
    }

    .card-code {
      position: absolute;
      top: 12px;
      right: 12px;
      z-index: 2;
      width: 28px;
      height: 14px;
      background:
        repeating-linear-gradient(
          90deg,
          var(--ink) 0 1.5px,
          transparent 1.5px 3.5px
        );
      opacity: 0.55;
      border-radius: 2px;
    }

    .card-glass {
      position: relative;
      z-index: 1;
      flex: 1;
      margin: 10px 4px 8px;
      border-radius: 16px;
      background: linear-gradient(145deg, rgba(255,255,255,0.75), rgba(255,255,255,0.28));
      border: 1px solid rgba(255,255,255,0.9);
      box-shadow:
        inset 0 1px 0 rgba(255,255,255,0.9),
        0 10px 24px rgba(20, 24, 33, 0.08);
      overflow: hidden;
      min-height: 0;
    }

    .card-glass::after {
      content: "";
      position: absolute;
      inset: 0;
      z-index: 1;
      background: linear-gradient(135deg, rgba(255,255,255,0.35) 0%, transparent 40%, transparent 60%, rgba(255,255,255,0.12) 100%);
      pointer-events: none;
    }

    .card-photo {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
      display: block;
    }

    .card-photo.placeholder {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: grid;
      place-items: center;
      color: var(--ink-soft);
      font-size: 11px;
      font-weight: 700;
      background: rgba(243,244,247,0.8);
    }

    .card-foot {
      position: relative;
      z-index: 2;
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      gap: 6px;
      margin-top: auto;
      min-height: 28px;
    }

    .card-pill {
      border: 1px solid var(--ink);
      border-radius: 999px;
      padding: 4px 8px;
      font-size: 10px;
      font-weight: 800;
      color: var(--ink);
      background: rgba(255,255,255,0.85);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      justify-self: start;
      max-width: 100%;
      min-width: 0;
    }

    .card-mark {
      width: 22px;
      height: 22px;
      border-radius: 7px;
      background: var(--ink);
      color: #fff;
      display: grid;
      place-items: center;
      justify-self: center;
      flex-shrink: 0;
    }

    .card-mark svg { width: 10px; height: 10px; }

    .card-actions {
      display: flex;
      gap: 4px;
      flex-shrink: 0;
      justify-self: end;
    }

    .mini-btn {
      width: 26px;
      height: 26px;
      border-radius: 9px;
      border: 1px solid var(--line);
      background: rgba(255,255,255,0.9);
      color: var(--ink-soft);
      cursor: pointer;
      display: grid;
      place-items: center;
    }

    .mini-btn:active { color: var(--ink); border-color: var(--ink); }
    .mini-btn.danger:active { color: var(--danger); border-color: var(--danger); }
    .mini-btn svg { width: 12px; height: 12px; }

    .badge {
      font-size: 9px;
      font-weight: 800;
      letter-spacing: 0.02em;
      text-transform: lowercase;
      padding: 2px 6px;
      border-radius: 999px;
      background: #111114;
      color: #fff;
      margin-left: 4px;
    }

    .fab-bar {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: 25;
      padding: 12px 14px calc(12px + var(--safe-bottom));
      background: linear-gradient(180deg, transparent, rgba(233, 235, 239, 0.92) 35%);
      pointer-events: none;
    }

    .fab-bar > * { pointer-events: auto; }

    .fab-row {
      max-width: 520px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 8px;
    }

    .btn-primary {
      border: none;
      border-radius: 18px;
      padding: 15px 18px;
      font-weight: 800;
      font-size: 14px;
      letter-spacing: -0.01em;
      cursor: pointer;
      background: var(--ink);
      color: #fff;
      box-shadow: 0 12px 24px rgba(17, 17, 20, 0.18);
      transition: transform 0.15s, opacity 0.15s;
    }

    .btn-primary:active { transform: scale(0.98); }
    .btn-primary:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }

    .btn-secondary {
      border: 1px solid var(--line-strong);
      border-radius: 18px;
      padding: 15px 14px;
      background: rgba(255,255,255,0.85);
      color: var(--ink);
      font-size: 13px;
      font-weight: 800;
      cursor: pointer;
      white-space: nowrap;
      backdrop-filter: blur(10px);
    }

    .btn-secondary:disabled {
      opacity: 0.35;
      cursor: not-allowed;
      color: var(--ink-soft);
    }

    .overlay {
      position: fixed;
      inset: 0;
      z-index: 40;
      background: rgba(20, 24, 33, 0.28);
      backdrop-filter: blur(6px);
      display: none;
      align-items: flex-end;
      justify-content: center;
    }

    .overlay.open { display: flex; }

    .sheet {
      width: 100%;
      max-width: 520px;
      max-height: min(92vh, 820px);
      overflow: auto;
      background: rgba(255,255,255,0.94);
      border: 1px solid var(--glass-edge);
      border-bottom: none;
      border-radius: 28px 28px 0 0;
      padding: 12px 16px calc(20px + var(--safe-bottom));
      box-shadow: 0 -12px 40px rgba(20, 24, 33, 0.12);
      animation: sheetUp 0.24s ease;
      -webkit-overflow-scrolling: touch;
    }

    @keyframes sheetUp {
      from { transform: translateY(28px); opacity: 0.5; }
      to { transform: none; opacity: 1; }
    }

    .sheet-handle {
      width: 40px;
      height: 4px;
      border-radius: 999px;
      background: rgba(17,17,20,0.15);
      margin: 4px auto 14px;
    }

    .sheet-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
    }

    .sheet-head h2 {
      font-size: 18px;
      font-weight: 800;
      letter-spacing: -0.02em;
    }

    .form { display: grid; gap: 14px; }

    .field label {
      display: block;
      font-size: 11px;
      font-weight: 700;
      color: var(--ink-soft);
      margin-bottom: 6px;
      letter-spacing: 0.03em;
      text-transform: lowercase;
    }

    .field label .req { color: var(--ink); }

    .field select,
    .field textarea,
    .field input[type="number"] {
      width: 100%;
      background: #f3f4f7;
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 12px 14px;
      outline: none;
      transition: border-color 0.15s, background 0.15s;
      font-weight: 600;
    }

    .field select:focus,
    .field textarea:focus,
    .field input:focus {
      border-color: var(--ink);
      background: #fff;
    }

    .field textarea {
      min-height: 88px;
      resize: vertical;
    }

    .photos-box,
    .geo-box,
    .settings-block,
    .menu-item {
      border: 1px solid var(--line);
      border-radius: 18px;
      background: rgba(255,255,255,0.72);
      box-shadow: var(--shadow-soft);
    }

    .photos-box,
    .geo-box {
      padding: 12px;
      display: grid;
      gap: 10px;
    }

    .photos-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 8px;
    }

    .photo-thumb {
      position: relative;
      aspect-ratio: 1;
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid var(--line);
      background: #f3f4f7;
      cursor: pointer;
    }

    .photo-thumb img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      pointer-events: none;
    }

    .photo-thumb .btn-remove-photo {
      position: absolute;
      top: 2px;
      right: 2px;
      width: 22px;
      height: 22px;
      border: none;
      border-radius: 8px;
      background: rgba(17, 17, 20, 0.72);
      color: #fff;
      font-size: 14px;
      line-height: 1;
      cursor: pointer;
    }

    .btn-add-photo {
      width: 100%;
      border: 1px dashed rgba(17,17,20,0.25);
      background: rgba(17,17,20,0.04);
      color: var(--ink);
      border-radius: 14px;
      padding: 12px;
      font-weight: 800;
      font-size: 13px;
      cursor: pointer;
    }

    .btn-add-photo:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    .photos-hint {
      font-size: 11px;
      color: var(--ink-soft);
      text-align: center;
      font-weight: 700;
    }

    .geo-status {
      display: flex;
      align-items: flex-start;
      gap: 10px;
    }

    .geo-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      margin-top: 4px;
      flex-shrink: 0;
      background: var(--ink-soft);
    }

    .geo-dot.pending {
      background: var(--warning);
      animation: pulse 1.2s infinite;
    }

    .geo-dot.ok { background: var(--ok); }
    .geo-dot.bad { background: var(--danger); }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.45; }
    }

    .geo-title { font-size: 13px; font-weight: 800; }
    .geo-meta { font-size: 12px; color: var(--ink-soft); margin-top: 3px; line-height: 1.45; font-weight: 600; }
    .geo-meta .ok { color: var(--ok); }
    .geo-meta .warn { color: var(--warning); }
    .geo-meta .gold { color: var(--gold); }

    .geo-actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .geo-actions button {
      border: 1px solid var(--line);
      background: #fff;
      color: var(--ink);
      border-radius: 12px;
      padding: 10px;
      font-size: 12px;
      font-weight: 800;
      cursor: pointer;
    }

    .geo-actions button:active { border-color: var(--ink); }

    .form-actions {
      display: grid;
      grid-template-columns: 1fr 1.4fr;
      gap: 8px;
      margin-top: 4px;
    }

    .btn-outline {
      border: 1px solid var(--line-strong);
      background: transparent;
      color: var(--ink);
      border-radius: 16px;
      padding: 13px;
      font-weight: 800;
      cursor: pointer;
    }

    .alert {
      display: none;
      align-items: flex-start;
      gap: 10px;
      padding: 12px;
      border-radius: 14px;
      background: var(--danger-dim);
      border: 1px solid rgba(214, 69, 69, 0.25);
      color: #8a2f2f;
      font-size: 13px;
      line-height: 1.4;
      font-weight: 700;
    }

    .alert.show { display: flex; }
    .alert strong { color: var(--warning); }

    .settings-block {
      padding: 14px;
      margin-bottom: 12px;
    }

    .settings-block h3 {
      font-size: 13px;
      margin-bottom: 12px;
      color: var(--ink);
      font-weight: 800;
    }

    .price-row {
      display: grid;
      grid-template-columns: 1fr 110px;
      gap: 10px;
      align-items: center;
      margin-bottom: 10px;
    }

    .price-row:last-child { margin-bottom: 0; }
    .price-row span { font-size: 13px; color: var(--ink-soft); font-weight: 700; }

    .menu-list { display: grid; gap: 8px; }

    .menu-item {
      width: 100%;
      text-align: left;
      padding: 14px;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
      color: var(--ink);
      font-weight: 800;
    }

    .menu-item:active { border-color: var(--ink); }
    .menu-item .hint { color: var(--ink-soft); font-size: 12px; font-weight: 700; }

    .toast {
      position: fixed;
      left: 50%;
      bottom: calc(96px + var(--safe-bottom));
      transform: translateX(-50%) translateY(12px);
      z-index: 400;
      background: rgba(255,255,255,0.92);
      border: 1px solid var(--line);
      color: var(--ink);
      padding: 10px 16px;
      border-radius: 16px;
      font-size: 13px;
      font-weight: 800;
      opacity: 0;
      pointer-events: none;
      transition: all 0.2s ease;
      max-width: calc(100% - 32px);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      box-shadow: var(--shadow);
      backdrop-filter: blur(12px);
    }

    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    .toast.warn {
      border-color: rgba(196, 138, 18, 0.35);
      color: #7a5608;
    }

    .hidden { display: none !important; }

    .stage {
      position: fixed;
      inset: 0;
      z-index: 300;
      display: none;
      flex-direction: column;
      background: #000;
      touch-action: none;
      overscroll-behavior: none;
      -webkit-user-select: none;
      user-select: none;
    }

    .stage.open { display: flex; }

    .stage-viewport {
      position: relative;
      flex: 1;
      min-height: 0;
      width: 100%;
      background: #000;
      overflow: hidden;
      touch-action: none;
      overscroll-behavior: none;
    }

    .stage-viewport video,
    .stage-viewport img.stage-img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
      background: #000;
      pointer-events: none;
    }

    .stage-viewport video.hidden,
    .stage-viewport img.stage-img.hidden { display: none; }

    #stageCanvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      touch-action: none;
      overscroll-behavior: none;
      z-index: 2;
      display: none;
      cursor: crosshair;
    }

    .stage.mode-draw #stageCanvas { display: block; }

    .stage-idle {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      color: rgba(255,255,255,0.55);
      text-align: center;
      padding: 24px;
      z-index: 1;
      font-weight: 700;
    }

    .stage-idle.hidden { display: none; }

    .stage-bar {
      flex-shrink: 0;
      padding: 12px 14px calc(14px + var(--safe-bottom));
      background: rgba(18, 18, 20, 0.96);
      border-top: 1px solid rgba(255,255,255,0.08);
      display: grid;
      gap: 10px;
      touch-action: manipulation;
    }

    .stage-hint { display: none; }

    .draw-row {
      display: none;
      grid-template-columns: auto 1fr auto;
      gap: 8px;
      align-items: center;
    }

    .stage.mode-draw .draw-row { display: grid; }

    .draw-colors {
      display: flex;
      gap: 6px;
      align-items: center;
    }

    .draw-color {
      width: 26px;
      height: 26px;
      border-radius: 50%;
      border: 2px solid transparent;
      cursor: pointer;
      padding: 0;
    }

    .draw-color.active {
      border-color: #fff;
      box-shadow: 0 0 0 2px #111;
    }

    .draw-size {
      display: flex;
      align-items: center;
      gap: 4px;
      color: rgba(255,255,255,0.55);
      font-size: 11px;
      font-weight: 700;
    }

    .draw-size input[type="range"] {
      width: 96px;
      accent-color: #fff;
      touch-action: manipulation;
      pointer-events: auto;
    }

    .draw-tools {
      display: flex;
      gap: 6px;
      justify-content: flex-end;
      flex-wrap: wrap;
    }

    .draw-tools button,
    .stage-actions button {
      border: 1px solid rgba(255,255,255,0.14);
      background: rgba(255,255,255,0.08);
      color: #fff;
      border-radius: 12px;
      padding: 10px 12px;
      font-size: 12px;
      font-weight: 800;
      cursor: pointer;
      white-space: nowrap;
    }

    .draw-tools button:disabled {
      opacity: 0.35;
      cursor: not-allowed;
    }

    .stage-actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .stage-actions .btn-shot,
    .stage-actions .btn-done {
      grid-column: 1 / -1;
      border: none;
      background: #fff;
      color: #111;
      font-size: 15px;
      padding: 14px;
      border-radius: 16px;
    }

    .stage-actions .btn-gold {
      color: #f0d78c;
      border-color: rgba(240, 215, 140, 0.35);
    }

    .stage.mode-camera .act-draw { display: none; }
    .stage.mode-draw .act-cam { display: none; }
    .stage.mode-camera .btn-shot { display: block; }
    .stage:not(.streaming) .btn-shot { opacity: 0.5; }

    .camera-fallback {
      position: absolute;
      width: 1px;
      height: 1px;
      opacity: 0;
      pointer-events: none;
    }

    .tape-swatch {
      display: inline-block;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      margin-right: 3px;
      vertical-align: middle;
      border: 1px solid rgba(0,0,0,0.15);
    }

    @media (max-width: 360px) {
      .loc-grid { grid-template-columns: 1fr; }
      .list { grid-template-columns: 1fr; }
      .card { aspect-ratio: 1.05; }
    }
  </style>
</head>
<body>
  <div class="app">
    <header class="header">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2.5l1.7 5.2H19l-4.2 3.1 1.6 5.2L12 12.9 7.6 16l1.6-5.2L5 7.7h5.3L12 2.5z"/></svg>
        </div>
        <h1>ЧудоБот - Логистика</h1>

      <button type="button" class="icon-btn" id="btnMenu" aria-label="Меню" title="Меню">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">

    <section class="stats" id="statsBlock">

      </div>

    <section class="list" id="itemsList"></section>

  <div class="fab-bar">
    <div class="fab-row">

      <button type="button" class="btn-secondary" id="btnRepeat" disabled title="Повторить">Повтор</button>
    </div>
  </div>

  <!-- Add / edit form -->
  <div class="overlay" id="formOverlay">
    <div class="sheet" role="dialog" aria-labelledby="formTitle">
      <div class="sheet-handle"></div>
      <div class="sheet-head">
        <h2 id="formTitle">Новая позиция</h2>
        <button type="button" class="icon-btn" id="btnCloseForm" aria-label="Закрыть">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M6 6l12 12M18 6L6 18" stroke-linecap="round"/>
          </svg>
        </button>
      </div>

      <form class="form" id="itemForm">
        <div class="field">
          <label>Фото Клада <span class="req">*</span></label>
          <div class="photos-box">
            <div class="photos-grid" id="photosGrid"></div>
            <button type="button" class="btn-add-photo" id="btnAddPhoto">Снять фото</button>
            <div class="photos-hint" id="photosHint">0 / 5</div>

        <div class="field">
          <label>GPS <span class="req">*</span></label>
          <div class="geo-box" id="geoBox">
            <div class="geo-status">
              <span class="geo-dot pending" id="geoDot"></span>
              <div>
                <div class="geo-title" id="geoTitle">GPS…</div>
                <div class="geo-meta" id="geoMeta">—</div>
              </div>
            </div>
            <div class="geo-actions">
              <button type="button" id="btnRefreshGeo">Обновить</button>
              <button type="button" id="btnGeoSettings">Доступ</button>
            </div>
          </div>
        </div>

        <div class="field">
          <label for="locationSelect">Тип локации <span class="req">*</span></label>
          <select id="locationSelect" required>
            <option value="warehouse_1">Тайник</option>
            <option value="warehouse_2">Подьезд</option>
            <option value="pickup">Прикоп</option>
          </select>
        </div>

        <div class="field">
          <label for="weightSelect">Граммовка (г) <span class="req">*</span></label>
          <select id="weightSelect" required>
            <option value="0.5">0.5 г</option>
            <option value="1">1 г</option>
            <option value="2">2 г</option>
            <option value="3">3 г</option>
            <option value="4">4 г</option>

        <div class="alert" id="heavyAlert">
          <div><strong>&gt; 3 г</strong></div>
        </div>

        <div class="field">
          <label for="tapeSelect">Цвет изоленты <span class="req">*</span></label>
          <select id="tapeSelect" required>
            <option value="yellow">Жёлтый</option>
            <option value="red">Красный</option>
            <option value="white">Белый</option>
            <option value="blue">Синий</option>
          </select>

        <div class="field">
          <label for="noteInput">Описание</label>
          <textarea id="noteInput" maxlength="500" placeholder="описание"></textarea>
        </div>

        <div class="form-actions">
          <button type="button" class="btn-outline" id="btnCancelForm">Отмена</button>
          <button type="submit" class="btn-primary" id="btnSaveItem">Сохранить</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Menu -->
  <div class="overlay" id="menuOverlay">
    <div class="sheet">
      <div class="sheet-handle"></div>
      <div class="sheet-head">
        <h2>Меню</h2>
        <button type="button" class="icon-btn" id="btnCloseMenu" aria-label="Закрыть">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M6 6l12 12M18 6L6 18" stroke-linecap="round"/>
          </svg>
        </button>
      </div>
      <div class="menu-list">
        <button type="button" class="menu-item" id="btnOpenSettings">
          <span>Цены</span>
          <span class="hint">₽</span>
        </button>
        <button type="button" class="menu-item" id="btnExportCsv">
          <span>CSV</span>
          <span class="hint">export</span>
        </button>
        <button type="button" class="menu-item" id="btnSyncServer">
          <span>Sync</span>
          <span class="hint">фото</span>
        </button>
        <button type="button" class="menu-item" id="btnSendToBot">
          <span>Отправить</span>
          <span class="hint">фото+данные</span>
        </button>
        <button type="button" class="menu-item" id="btnCloseApp">
          <span>Close</span>
          <span class="hint">tg</span>
        </button>
      </div>
    </div>
  </div>

  <!-- Settings -->
  <div class="overlay" id="settingsOverlay">
    <div class="sheet">
      <div class="sheet-handle"></div>
      <div class="sheet-head">
        <h2>Настройки</h2>
        <button type="button" class="icon-btn" id="btnCloseSettings" aria-label="Закрыть">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M6 6l12 12M18 6L6 18" stroke-linecap="round"/>
          </svg>
        </button>
      </div>

      <div class="settings-block">
        <h3>Цена по граммовке (₽)</h3>
        <div id="priceRows"></div>
      </div>

      <button type="button" class="btn-primary" id="btnSaveSettings" style="width:100%">Сохранить настройки</button>
    </div>
  </div>

  <!-- FULLSCREEN STATIC STAGE -->
  <div class="stage mode-camera" id="stage" aria-hidden="true">
    <div class="stage-viewport" id="stageViewport">
      <div class="stage-idle" id="stageIdle">
        <div>
          <div style="font-size:15px;color:#e8efe9;margin-bottom:6px;">Камера</div>
          <div style="font-size:12px;">Включаем съёмку…</div>
        </div>
      </div>
      <video id="stageVideo" class="hidden" playsinline muted autoplay></video>
      <img id="stageImage" class="stage-img hidden" alt="Снимок" />
      <canvas id="stageCanvas"></canvas>
    </div>
    <div class="stage-bar">
      <div class="stage-hint" id="stageHint"></div>
      <div class="draw-row">
        <div class="draw-colors" id="drawColors">
          <button type="button" class="draw-color active" data-color="#3dcf7a" style="background:#3dcf7a" aria-label="Зелёный"></button>
          <button type="button" class="draw-color" data-color="#d4af37" style="background:#d4af37" aria-label="Золотой"></button>
          <button type="button" class="draw-color" data-color="#ff3b30" style="background:#ff3b30" aria-label="Красный"></button>
          <button type="button" class="draw-color" data-color="#ffffff" style="background:#ffffff" aria-label="Белый"></button>
          <button type="button" class="draw-color" data-color="#0a84ff" style="background:#0a84ff" aria-label="Синий"></button>
        </div>
        <label class="draw-size">
          Толщ. <strong id="drawSizeLabel">4</strong>
          <input type="range" id="drawSize" min="1" max="24" value="4" step="1" />
        </label>
        <div class="draw-tools">
          <button type="button" id="btnUndoDraw" disabled>↩</button>
          <button type="button" id="btnClearDraw" disabled>Сброс</button>
        </div>
      </div>
      <div class="stage-actions">
        <button type="button" class="btn-shot act-cam" id="btnCapture">Снять</button>
        <button type="button" class="btn-done act-cam" id="btnFinishCam">Готово</button>
        <button type="button" class="btn-done act-draw" id="btnDoneDraw">Готово</button>
        <button type="button" class="btn-gold act-draw" id="btnRetake">Сброс</button>
        <button type="button" id="btnCancelStage">Закрыть</button>

    <input type="file" id="photoInput" class="camera-fallback" accept="image/*" capture="environment" tabindex="-1" />
  </div>

  <div class="toast" id="toast"></div>

  <script>
  (function () {
    "use strict";

    const STORAGE_ITEMS = "logistics_items_v1";
    const STORAGE_PRICES = "logistics_prices_v2";
    const STORAGE_DRAFT = "logistics_draft_v2";
    const STORAGE_LAST = "logistics_last_v2";
    const MAX_PHOTOS = 5;

    const LOCATIONS = [
      { id: "warehouse_1", label: "Тайник" },
      { id: "warehouse_2", label: "Подьезд" },
      { id: "pickup", label: "Прикоп" }
    ];

    const TAPE_COLORS = [
      { id: "yellow", label: "Жёлтый", hex: "#f0d000" },
      { id: "red", label: "Красный", hex: "#ff3b30" },
      { id: "white", label: "Белый", hex: "#ffffff" },
      { id: "blue", label: "Синий", hex: "#0a84ff" }
    ];

    const WEIGHTS = [0.5, 1, 2, 3, 4, 5];
    const HEAVY_WEIGHT_G = 3;

    const DEFAULT_PRICES = {
      "0.5": 80,
      "1": 140,
      "2": 260,
      "3": 380,
      "4": 490,
      "5": 600
    };

    const tg = window.Telegram && window.Telegram.WebApp ? window.Telegram.WebApp : null;

    /** @type {Array<Object>} */
    let items = [];
    let prices = { ...DEFAULT_PRICES };
    let activeFilter = "all";
    let suppressDraft = false;
    let editingId = null;

    /** Form photos being composed */
    let formPhotos = [];

    /** Stage state */
    let mediaStream = null;
    let stageRaw = "";
    let stageStrokes = [];
    let stageCurrent = null;
    let drawColor = "#3dcf7a";
    let drawWidthPx = 4;
    let isDrawing = false;
    let stageOpen = false;
    let bodyScrollY = 0;
    /** null = burst capture; number = editing formPhotos[idx] */
    let editingPhotoIdx = null;
    /** natural size of photo in draw mode */
    let stageImgSize = { w: 1, h: 1 };

    /** Geo */
    let currentGeo = null;
    let currentAddress = "";
    let addressLookupToken = 0;
    let lastAddressCoords = null;
    let geoWatchId = null;
    let geoCollectTimer = null;
    let geoSamples = [];
    let geoBusy = false;

    const GEO_TARGET_ACCURACY_M = 15;
    const GEO_ACCEPTABLE_M = 80;
    const GEO_COLLECT_MS = 12000;
    const GEO_SAMPLE_LIMIT = 24;
    const GEO_REJECT_ACCURACY_M = 2000;

    const $ = (id) => document.getElementById(id);

    const els = {
      itemsList: $("itemsList"),
      locStats: $("locStats"),
      filterChips: $("filterChips"),
      totalRevenue: $("totalRevenue"),
      totalWeight: $("totalWeight"),
      totalCount: $("totalCount"),
      formOverlay: $("formOverlay"),
      menuOverlay: $("menuOverlay"),
      settingsOverlay: $("settingsOverlay"),
      itemForm: $("itemForm"),
      formTitle: $("formTitle"),
      photosGrid: $("photosGrid"),
      photosHint: $("photosHint"),
      btnAddPhoto: $("btnAddPhoto"),
      photoInput: $("photoInput"),
      geoDot: $("geoDot"),
      geoTitle: $("geoTitle"),
      geoMeta: $("geoMeta"),
      btnRefreshGeo: $("btnRefreshGeo"),
      btnGeoSettings: $("btnGeoSettings"),
      locationSelect: $("locationSelect"),
      weightSelect: $("weightSelect"),
      tapeSelect: $("tapeSelect"),
      noteInput: $("noteInput"),
      heavyAlert: $("heavyAlert"),
      btnAdd: $("btnAdd"),
      btnRepeat: $("btnRepeat"),
      btnCloseForm: $("btnCloseForm"),
      btnCancelForm: $("btnCancelForm"),
      btnSaveItem: $("btnSaveItem"),
      btnMenu: $("btnMenu"),
      btnCloseMenu: $("btnCloseMenu"),
      btnOpenSettings: $("btnOpenSettings"),
      btnCloseSettings: $("btnCloseSettings"),
      btnSaveSettings: $("btnSaveSettings"),
      btnExportCsv: $("btnExportCsv"),
      btnSyncServer: $("btnSyncServer"),
      btnSendToBot: $("btnSendToBot"),
      btnCloseApp: $("btnCloseApp"),
      toast: $("toast"),
      stage: $("stage"),
      stageViewport: $("stageViewport"),
      stageIdle: $("stageIdle"),
      stageVideo: $("stageVideo"),
      stageImage: $("stageImage"),
      stageCanvas: $("stageCanvas"),
      stageHint: $("stageHint"),
      drawColors: $("drawColors"),
      drawSize: $("drawSize"),
      drawSizeLabel: $("drawSizeLabel"),
      btnUndoDraw: $("btnUndoDraw"),
      btnClearDraw: $("btnClearDraw"),
      btnCapture: $("btnCapture"),
      btnFinishCam: $("btnFinishCam"),
      btnDoneDraw: $("btnDoneDraw"),
      btnRetake: $("btnRetake"),
      btnCancelStage: $("btnCancelStage")
    };

    /* ── Telegram ── */

    function initTelegram() {
      if (!tg) return;
      try {
        tg.ready();
        tg.expand();
        if (tg.setHeaderColor) tg.setHeaderColor("#e9ebef");
        if (tg.setBackgroundColor) tg.setBackgroundColor("#e9ebef");
      } catch (_) { /* ignore */ }
    }

    function setVerticalSwipes(enabled) {
      if (!tg) return;
      try {
        if (enabled && typeof tg.enableVerticalSwipes === "function") {
          tg.enableVerticalSwipes();
        } else if (!enabled && typeof tg.disableVerticalSwipes === "function") {
          tg.disableVerticalSwipes();
        }
      } catch (_) { /* ignore */ }
    }

    function requestStageFullscreen() {
      if (!tg) return;
      try {
        if (typeof tg.requestFullscreen === "function") tg.requestFullscreen();
      } catch (_) { /* ignore */ }
    }

    function exitStageFullscreen() {
      if (!tg) return;
      try {
        if (typeof tg.exitFullscreen === "function") tg.exitFullscreen();
      } catch (_) { /* ignore */ }
    }

    /* ── Storage / utils ── */

    function loadJSON(key, fallback) {
      try {
        const raw = localStorage.getItem(key);
        if (!raw) return fallback;
        return JSON.parse(raw);
      } catch (_) {
        return fallback;
      }
    }

    function saveJSON(key, value) {
      try {
        localStorage.setItem(key, JSON.stringify(value));
        return true;
      } catch (_) {
        return false;
      }
    }

    function saveItemsPersistent(nextItems) {
      if (saveJSON(STORAGE_ITEMS, nextItems)) {
        items = nextItems;
        return true;
      }
      // fallback: keep finals only (drop raw duplicates) to fit quota
      const slim = nextItems.map((it) => ({
        id: it.id,
        location: it.location,
        weight: it.weight,
        tapeColor: it.tapeColor,
        note: it.note,
        geo: it.geo,
        createdAt: it.createdAt,
        updatedAt: it.updatedAt,
        photos: (it.photos || []).map((p) => ({
          id: p.id,
          raw: p.final || p.raw || "",
          strokes: [],
          final: p.final || p.raw || ""
        }))
      }));
      if (saveJSON(STORAGE_ITEMS, slim)) {
        items = slim;
        showToast("Сохранено (slim)");
        return true;
      }
      showToast("quota", true);
      return false;
    }

    function locationLabel(id) {
      const found = LOCATIONS.find((l) => l.id === id);
      return found ? found.label : id;
    }

    function tapeLabel(id) {
      const found = TAPE_COLORS.find((t) => t.id === id);
      return found ? found.label : id || "—";
    }

    function tapeHex(id) {
      const found = TAPE_COLORS.find((t) => t.id === id);
      return found ? found.hex : "#888";
    }

    function formatRub(n) {
      return new Intl.NumberFormat("ru-RU", {
        style: "currency",
        currency: "RUB",
        maximumFractionDigits: 0
      }).format(n || 0);
    }

    function formatGrams(n) {
      const v = Number(n) || 0;
      const text = Number.isInteger(v) ? String(v) : String(v);
      return text + " г";
    }

    function weightKey(weight) {
      const v = Number(weight);
      if (!isFinite(v)) return String(weight);
      return WEIGHTS.includes(v) ? String(v) : String(weight);
    }

    function itemPrice(weight) {
      return Math.max(0, Number(prices[weightKey(weight)]) || 0);
    }

    function itemRevenue(item) {
      return itemPrice(item.weight);
    }

    function formatDate(iso) {
      try {
        return new Intl.DateTimeFormat("ru-RU", {
          day: "2-digit",
          month: "short",
          year: "numeric",
          hour: "2-digit",
          minute: "2-digit"
        }).format(new Date(iso));
      } catch (_) {
        return iso;
      }
    }

    function formatDateStamp(iso) {
      try {
        return new Intl.DateTimeFormat("ru-RU", {
          day: "2-digit",
          month: "2-digit",
          year: "numeric",
          hour: "2-digit",
          minute: "2-digit",
          second: "2-digit"
        }).format(new Date(iso));
      } catch (_) {
        return iso;
      }
    }

    function uid(prefix) {
      return (prefix || "i") + "_" + Date.now().toString(36) + "_" + Math.random().toString(36).slice(2, 8);
    }

    function showToast(message, warn) {
      els.toast.textContent = message;
      els.toast.classList.toggle("warn", !!warn);
      els.toast.classList.add("show");
      clearTimeout(showToast._t);
      showToast._t = setTimeout(() => els.toast.classList.remove("show"), 2800);
    }

    function haptic(type) {
      try {
        if (tg && tg.HapticFeedback) {
          if (type === "warn") tg.HapticFeedback.notificationOccurred("warning");
          else if (type === "ok") tg.HapticFeedback.notificationOccurred("success");
          else tg.HapticFeedback.impactOccurred("light");
        }
      } catch (_) { /* ignore */ }
    }

    function escapeHtml(str) {
      return String(str)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    function escapeAttr(str) {
      return escapeHtml(str).replace(/'/g, "&#39;");
    }

    /* ── Migration ── */

    function migratePhoto(photo, index) {
      if (!photo) return null;
      if (typeof photo === "string") {
        return {
          id: uid("p"),
          raw: photo,
          strokes: [],
          final: photo
        };
      }
      if (typeof photo === "object") {
        return {
          id: photo.id || uid("p"),
          raw: photo.raw || photo.final || "",
          strokes: Array.isArray(photo.strokes) ? photo.strokes : [],
          final: photo.final || photo.raw || ""
        };
      }
      return null;
    }

    function migrateItem(raw) {
      if (!raw || typeof raw !== "object") return null;
      let photos = [];
      if (Array.isArray(raw.photos) && raw.photos.length) {
        photos = raw.photos.map(migratePhoto).filter(Boolean);
      } else if (raw.photo) {
        photos = [migratePhoto(raw.photo, 0)].filter(Boolean);
      }

      const weight = Number(raw.weight);
      const tapeColor = TAPE_COLORS.some((t) => t.id === raw.tapeColor)
        ? raw.tapeColor
        : "yellow";

      return {
        id: raw.id || uid("i"),
        location: raw.location || "warehouse_1",
        weight: WEIGHTS.includes(weight) ? weight : 0.5,
        tapeColor: tapeColor,
        note: raw.note || "",
        photos: photos,
        geo: raw.geo || null,
        createdAt: raw.createdAt || new Date().toISOString(),
        updatedAt: raw.updatedAt || raw.createdAt || new Date().toISOString()
      };
    }

    function loadItems() {
      const raw = loadJSON(STORAGE_ITEMS, []);
      if (!Array.isArray(raw)) return [];
      const migrated = raw.map(migrateItem).filter(Boolean);
      saveJSON(STORAGE_ITEMS, migrated);
      return migrated;
    }

    /* ── Geolocation ── */

    function formatCoords(lat, lon) {
      return Number(lat).toFixed(6) + ", " + Number(lon).toFixed(6);
    }

    function formatAccuracy(m) {
      if (m == null || !isFinite(m)) return "н/д";
      if (m < 10) return m.toFixed(1) + " м";
      return Math.round(m) + " м";
    }

    function sourceLabel(source) {
      if (source === "telegram") return "Telegram GPS";
      if (source === "browser") return "GPS устройства";
      if (source === "fused") return "GPS (уточнённый)";
      return source || "GPS";
    }

    function normalizeFix(raw) {
      if (!raw) return null;
      const lat = Number(raw.latitude);
      const lon = Number(raw.longitude);
      if (!isFinite(lat) || !isFinite(lon)) return null;
      if (Math.abs(lat) > 90 || Math.abs(lon) > 180) return null;

      let accuracy = raw.accuracy != null ? Number(raw.accuracy) : Number(raw.horizontal_accuracy);
      if (!isFinite(accuracy) || accuracy <= 0) accuracy = 9999;
      if (accuracy > GEO_REJECT_ACCURACY_M) return null;

      return {
        latitude: lat,
        longitude: lon,
        accuracy: accuracy,
        altitude: raw.altitude != null && isFinite(Number(raw.altitude)) ? Number(raw.altitude) : null,
        altitudeAccuracy: raw.altitudeAccuracy != null
          ? Number(raw.altitudeAccuracy)
          : (raw.vertical_accuracy != null ? Number(raw.vertical_accuracy) : null),
        heading: raw.heading != null
          ? Number(raw.heading)
          : (raw.course != null ? Number(raw.course) : null),
        speed: raw.speed != null ? Number(raw.speed) : null,
        source: raw.source || "unknown",
        timestamp: raw.timestamp || Date.now(),
        address: raw.address || ""
      };
    }

    function haversineM(lat1, lon1, lat2, lon2) {
      const R = 6371000;
      const toRad = (d) => (d * Math.PI) / 180;
      const dLat = toRad(lat2 - lat1);
      const dLon = toRad(lon2 - lon1);
      const a =
        Math.sin(dLat / 2) * Math.sin(dLat / 2) +
        Math.cos(toRad(lat1)) * Math.cos(toRad(lat2)) *
        Math.sin(dLon / 2) * Math.sin(dLon / 2);
      return 2 * R * Math.asin(Math.sqrt(a));
    }

    function fuseBestSamples() {
      const good = geoSamples
        .filter((s) => s.accuracy <= Math.max(GEO_ACCEPTABLE_M, (currentGeo && currentGeo.accuracy) || GEO_ACCEPTABLE_M))
        .slice()
        .sort((a, b) => a.accuracy - b.accuracy)
        .slice(0, 5);

      if (!good.length) return null;
      if (good.length === 1) return good[0];

      const best = good[0];
      const cluster = good.filter((s) => haversineM(best.latitude, best.longitude, s.latitude, s.longitude) <= 40);
      const pool = cluster.length ? cluster : [best];
      let wSum = 0;
      let lat = 0;
      let lon = 0;
      let acc = Infinity;
      pool.forEach((s) => {
        const w = 1 / Math.max(s.accuracy, 1);
        wSum += w;
        lat += s.latitude * w;
        lon += s.longitude * w;
        acc = Math.min(acc, s.accuracy);
      });

      return {
        latitude: lat / wSum,
        longitude: lon / wSum,
        accuracy: acc,
        altitude: best.altitude,
        altitudeAccuracy: best.altitudeAccuracy,
        heading: best.heading,
        speed: best.speed,
        source: pool.some((p) => p.source !== pool[0].source) ? "fused" : pool[0].source,
        timestamp: Date.now(),
        address: currentAddress || ""
      };
    }

    function considerFix(fix) {
      const n = normalizeFix(fix);
      if (!n) return;
      geoSamples.push(n);
      if (geoSamples.length > GEO_SAMPLE_LIMIT) geoSamples.shift();

      if (
        !currentGeo ||
        n.accuracy + 0.5 < currentGeo.accuracy ||
        (Math.abs(n.accuracy - currentGeo.accuracy) <= 0.5 && n.timestamp > currentGeo.timestamp)
      ) {
        currentGeo = fuseBestSamples() || n;
        renderGeoUi();
        scheduleAddressLookup();
        saveDraft();
      } else {
        renderGeoUi();
      }

      if (currentGeo && currentGeo.accuracy <= GEO_TARGET_ACCURACY_M) {
        stopGeoWatch();
        geoBusy = false;
        renderGeoUi();
      }
    }

    function formatStreetAddress(street, house) {
      const s = String(street || "").replace(/^ул\.?\s*/i, "").trim();
      const h = String(house || "").trim();
      if (s && h) return "ул. " + s + ", дом " + h;
      if (s) return "ул. " + s;
      if (h) return "дом " + h;
      return "";
    }

    function streetOnlyAddress(addr) {
      if (!addr) return "";
      const raw = String(addr).trim();
      if (!raw || raw === "Определяем адрес…" || raw === "Адрес не найден") return "";
      const dropPart = /(район|область|обл\.?|республика|край|округ|^г\.|город|муницип|село|деревня|посёл|поселок|пгт)/i;
      const parts = raw.split(",").map((p) => p.trim()).filter(Boolean);
      const kept = parts.filter((p) => !dropPart.test(p));
      const streetish = kept.filter((p) =>
        /^(ул\.|улица|пер\.|переулок|просп|пр-т|пр\.|ш\.|шоссе|наб\.|бул|бульвар|дом|д\.|проезд|пл\.|площадь)/i.test(p) ||
        /^\d+[а-яa-z]?$/i.test(p)
      );
      // только улица/дом — без города и района
      if (streetish.length) return streetish.slice(0, 2).join(", ");
      return "";
    }

    function buildAddressFromGeoData(data) {
      if (!data) return "";
      return formatStreetAddress(
        data.street || data.road || "",
        data.streetNumber || data.street_number || ""
      );
    }

    function buildAddressFromNominatim(data) {
      if (!data) return "";
      const a = data.address || {};
      return formatStreetAddress(
        a.road || a.pedestrian || a.street || a.footway || a.residential || "",
        a.house_number || ""
      );
    }

    async function resolveAddress(lat, lon) {
      const url =
        "https://api.bigdatacloud.net/data/reverse-geocode-client?latitude=" +
        encodeURIComponent(lat) +
        "&longitude=" +
        encodeURIComponent(lon) +
        "&localityLanguage=ru";
      try {
        const res = await fetch(url);
        if (!res.ok) throw new Error("geo http");
        const data = await res.json();
        const addr = buildAddressFromGeoData(data);
        if (addr) return addr;
      } catch (_) { /* try nominatim */ }

      try {
        const nom =
          "https://nominatim.openstreetmap.org/reverse?format=jsonv2&lat=" +
          encodeURIComponent(lat) +
          "&lon=" +
          encodeURIComponent(lon) +
          "&accept-language=ru&addressdetails=1";
        const res = await fetch(nom, { headers: { Accept: "application/json" } });
        if (!res.ok) throw new Error("nom http");
        const data = await res.json();
        const addr = buildAddressFromNominatim(data);
        if (addr) return addr;
      } catch (_) { /* ignore */ }

      return "";
    }

    function scheduleAddressLookup() {
      if (!currentGeo) return;
      const lat = currentGeo.latitude;
      const lon = currentGeo.longitude;
      if (
        lastAddressCoords &&
        currentAddress &&
        haversineM(lastAddressCoords.lat, lastAddressCoords.lon, lat, lon) < 30
      ) {
        return;
      }
      const token = ++addressLookupToken;
      currentAddress = currentAddress || "Определяем адрес…";
      renderGeoUi();
      resolveAddress(lat, lon).then((addr) => {
        if (token !== addressLookupToken) return;
        currentAddress = streetOnlyAddress(addr) || "Адрес не найден";
        lastAddressCoords = { lat: lat, lon: lon };
        if (currentGeo) currentGeo.address = currentAddress;
        renderGeoUi();
        saveDraft();
      });
    }

    function renderGeoUi() {
      const dot = els.geoDot;
      dot.classList.remove("pending", "ok", "bad");

      if (geoBusy && !currentGeo) {
        dot.classList.add("pending");
        els.geoTitle.textContent = "GPS…";
        els.geoMeta.textContent = "—";
        return;
      }

      if (!currentGeo) {
        dot.classList.add("bad");
        els.geoTitle.textContent = "нет GPS";
        els.geoMeta.innerHTML = '<span class="warn">нужен доступ</span>';
        return;
      }

      const good = currentGeo.accuracy <= GEO_TARGET_ACCURACY_M;
      const ok = currentGeo.accuracy <= GEO_ACCEPTABLE_M;
      dot.classList.add(ok ? "ok" : "pending");
      els.geoTitle.textContent = formatCoords(currentGeo.latitude, currentGeo.longitude);
      els.geoMeta.innerHTML =
        '<span class="' + (good ? "ok" : ok ? "gold" : "warn") + '">±' +
        escapeHtml(formatAccuracy(currentGeo.accuracy)) +
        "</span> · " +
        escapeHtml(sourceLabel(currentGeo.source)) +
        (geoBusy ? " · уточняем…" : good ? " · высокая точность" : " · можно уточнить") +
        (currentGeo.altitude != null
          ? "<br/>высота ~" + escapeHtml(String(Math.round(currentGeo.altitude))) + " м"
          : "") +
        (currentAddress
          ? "<br/><span class=\"gold\">" + escapeHtml(currentAddress) + "</span>"
          : "");
    }

    function stopGeoWatch() {
      if (geoWatchId != null && navigator.geolocation) {
        try { navigator.geolocation.clearWatch(geoWatchId); } catch (_) { /* ignore */ }
      }
      geoWatchId = null;
      if (geoCollectTimer) {
        clearTimeout(geoCollectTimer);
        geoCollectTimer = null;
      }
    }

    function initTelegramLocationManager() {
      return new Promise((resolve) => {
        if (!tg || !tg.LocationManager) {
          resolve(false);
          return;
        }
        const lm = tg.LocationManager;
        if (lm.isInited) {
          resolve(true);
          return;
        }
        try {
          lm.init(() => resolve(true));
          setTimeout(() => resolve(!!lm.isInited), 2500);
        } catch (_) {
          resolve(false);
        }
      });
    }

    function requestTelegramLocation() {
      return new Promise(async (resolve) => {
        let settled = false;
        const done = (value) => {
          if (settled) return;
          settled = true;
          resolve(value);
        };

        const ready = await initTelegramLocationManager();
        if (!ready || !tg || !tg.LocationManager) {
          done(null);
          return;
        }
        const lm = tg.LocationManager;
        if (lm.isLocationAvailable === false) {
          done(null);
          return;
        }
        try {
          lm.getLocation((data) => {
            if (!data) {
              done(null);
              return;
            }
            done(normalizeFix({
              latitude: data.latitude,
              longitude: data.longitude,
              accuracy: data.horizontal_accuracy,
              altitude: data.altitude,
              vertical_accuracy: data.vertical_accuracy,
              course: data.course,
              speed: data.speed,
              source: "telegram",
              timestamp: Date.now()
            }));
          });
        } catch (_) {
          done(null);
          return;
        }
        setTimeout(() => done(null), 8000);
      });
    }

    function requestBrowserFixOnce(timeout) {
      return new Promise((resolve) => {
        if (!navigator.geolocation) {
          resolve(null);
          return;
        }
        navigator.geolocation.getCurrentPosition(
          (pos) => {
            const c = pos.coords;
            resolve(normalizeFix({
              latitude: c.latitude,
              longitude: c.longitude,
              accuracy: c.accuracy,
              altitude: c.altitude,
              altitudeAccuracy: c.altitudeAccuracy,
              heading: c.heading,
              speed: c.speed,
              source: "browser",
              timestamp: pos.timestamp || Date.now()
            }));
          },
          () => resolve(null),
          {
            enableHighAccuracy: true,
            maximumAge: 0,
            timeout: timeout || 10000
          }
        );
      });
    }

    function startBrowserWatch() {
      if (!navigator.geolocation || geoWatchId != null) return;
      geoWatchId = navigator.geolocation.watchPosition(
        (pos) => {
          const c = pos.coords;
          considerFix({
            latitude: c.latitude,
            longitude: c.longitude,
            accuracy: c.accuracy,
            altitude: c.altitude,
            altitudeAccuracy: c.altitudeAccuracy,
            heading: c.heading,
            speed: c.speed,
            source: "browser",
            timestamp: pos.timestamp || Date.now()
          });
        },
        () => { /* keep waiting */ },
        {
          enableHighAccuracy: true,
          maximumAge: 0,
          timeout: 15000
        }
      );
    }

    async function acquirePreciseGeo(options) {
      options = options || {};
      stopGeoWatch();
      if (!options.keepBest) {
        currentGeo = null;
        currentAddress = "";
        lastAddressCoords = null;
        addressLookupToken += 1;
        geoSamples = [];
      }
      geoBusy = true;
      renderGeoUi();

      startBrowserWatch();

      const [tgFix, browserFix] = await Promise.all([
        requestTelegramLocation(),
        requestBrowserFixOnce(10000)
      ]);

      if (tgFix) considerFix(tgFix);
      if (browserFix) considerFix(browserFix);

      if (geoCollectTimer) clearTimeout(geoCollectTimer);
      geoCollectTimer = setTimeout(() => {
        stopGeoWatch();
        geoBusy = false;
        if (currentGeo && currentGeo.accuracy > GEO_ACCEPTABLE_M) {
          showToast("GPS ±" + formatAccuracy(currentGeo.accuracy), true);
        } else if (!currentGeo) {
          showToast("нет GPS", true);
        } else if (currentGeo.accuracy <= GEO_TARGET_ACCURACY_M) {
          showToast("GPS ok");
          haptic("ok");
        }
        renderGeoUi();
        saveDraft();
      }, GEO_COLLECT_MS);
    }

    function openTelegramGeoSettings() {
      if (tg && tg.LocationManager && typeof tg.LocationManager.openSettings === "function") {
        try {
          tg.LocationManager.openSettings();
          return;
        } catch (_) { /* fallthrough */ }
      }
      showToast("нужен доступ к GPS");
    }

    /* ── Stats / list ── */

    function getFilteredItems() {
      if (activeFilter === "all") return items.slice().reverse();
      return items.filter((i) => i.location === activeFilter).reverse();
    }

    function computeStats() {
      const byLoc = {};
      LOCATIONS.forEach((l) => {
        byLoc[l.id] = { weight: 0, revenue: 0, count: 0 };
      });

      let totalWeight = 0;
      let totalRevenue = 0;

      items.forEach((item) => {
        const w = Number(item.weight) || 0;
        const rev = itemRevenue(item);
        totalWeight += w;
        totalRevenue += rev;
        if (byLoc[item.location]) {
          byLoc[item.location].weight += w;
          byLoc[item.location].revenue += rev;
          byLoc[item.location].count += 1;
        }
      });

      return { byLoc, totalWeight, totalRevenue, totalCount: items.length };
    }

    function renderStats() {
      const { byLoc, totalWeight, totalRevenue, totalCount } = computeStats();
      els.totalRevenue.textContent = formatRub(totalRevenue);
      els.totalWeight.textContent = formatGrams(totalWeight);
      els.totalCount.textContent = String(totalCount);

      els.locStats.innerHTML = LOCATIONS.map((l) => {
        const s = byLoc[l.id];
        return (
          '<div class="loc-stat">' +
            '<div class="name">#' + escapeHtml(l.label.toLowerCase()) + "</div>" +
            '<div class="kg">' + escapeHtml(formatGrams(s.weight)) + "</div>" +
            '<div class="rub">' + escapeHtml(formatRub(s.revenue)) + "</div>" +
          "</div>"

                  '</svg>' +

    /* ── Overlays ── */
