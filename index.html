    /* ── Image helpers ── */

    function loadImageElement(src) {
      return new Promise((resolve, reject) => {
        const img = new Image();
        img.onload = () => resolve(img);
        img.onerror = reject;
        img.src = src;
      });
    }

    function compressImage(dataUrl, maxSide, quality) {
      return new Promise((resolve) => {
        const img = new Image();
        img.onload = () => {
          let { width, height } = img;
          const scale = Math.min(1, maxSide / Math.max(width, height));
          width = Math.round(width * scale);
          height = Math.round(height * scale);
          const canvas = document.createElement("canvas");
          canvas.width = width;
          canvas.height = height;
          const ctx = canvas.getContext("2d");
          ctx.drawImage(img, 0, 0, width, height);
          try {
            resolve(canvas.toDataURL("image/jpeg", quality));
          } catch (_) {
            resolve(dataUrl);
          }
        };
        img.onerror = () => resolve(dataUrl);
        img.src = dataUrl;
      });
    }

    function readFileAsDataURL(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => resolve(String(reader.result || ""));
        reader.onerror = () => reject(reader.error);
        reader.readAsDataURL(file);
      });
    }

    function getContainRect(imgW, imgH, viewW, viewH) {
      const scale = Math.min(viewW / imgW, viewH / imgH);
      const drawnW = imgW * scale;
      const drawnH = imgH * scale;
      return {
        scale: scale,
        offsetX: (viewW - drawnW) / 2,
        offsetY: (viewH - drawnH) / 2,
        drawnW: drawnW,
        drawnH: drawnH
      };
    }

    function mapContainPoint(nx, ny, imgW, imgH, viewW, viewH) {
      const r = getContainRect(imgW, imgH, viewW, viewH);
      const vx = nx * viewW;
      const vy = ny * viewH;
      return {
        x: (vx - r.offsetX) / r.scale,
        y: (vy - r.offsetY) / r.scale
      };
    }

    function wrapTextLines(ctx, text, maxWidth) {
      const words = String(text || "").split(/\s+/).filter(Boolean);
      if (!words.length) return [""];
      const lines = [];
      let line = "";
      words.forEach((word) => {
        const test = line ? line + " " + word : word;
        if (ctx.measureText(test).width > maxWidth && line) {
          lines.push(line);
          line = word;
        } else {
          line = test;
        }
      });
      if (line) lines.push(line);
      return lines;
    }

    function buildStampMeta(meta) {
      meta = meta || {};
      const note = (meta.note || "").trim();
      const lines = [
        "Изолента: " + tapeLabel(meta.tapeColor),
        "Место: " + locationLabel(meta.location),
        "Описание: " + (note || "—")
      ];
      const geo = meta.geo;
      if (geo && geo.latitude != null && geo.longitude != null) {
        lines.push(
          formatCoords(geo.latitude, geo.longitude) +
          (geo.accuracy != null ? "  ±" + formatAccuracy(geo.accuracy) : "")
        );
      }
      const addr = streetOnlyAddress(meta.address || (geo && geo.address) || "");
      if (addr) lines.push(addr);
      return lines;
    }

    function paintStamp(ctx, width, height, meta) {
      const pad = Math.max(10, Math.round(width * 0.025));
      const fontSize = Math.max(13, Math.round(width * 0.028));
      const lineH = Math.round(fontSize * 1.28);
      ctx.save();
      ctx.font = "600 " + fontSize + "px Segoe UI, system-ui, sans-serif";
      ctx.textBaseline = "top";

      const maxTextW = width - pad * 2;
      const wrapped = [];
      buildStampMeta(meta).forEach((l, idx) => {
        if (idx === 2 || idx >= 4) {
          wrapTextLines(ctx, l, maxTextW).slice(0, 3).forEach((w) => wrapped.push(w));
        } else {
          wrapped.push(l);
        }
      });

      const boxH = pad + wrapped.length * lineH + pad;
      const boxY = height - boxH;

      ctx.fillStyle = "rgba(0, 0, 0, 0.66)";
      ctx.fillRect(0, boxY, width, boxH);

      const grad = ctx.createLinearGradient(0, boxY, width, boxY);
      grad.addColorStop(0, "#3dcf7a");
      grad.addColorStop(1, "#d4af37");
      ctx.fillStyle = grad;
      ctx.fillRect(0, boxY, width, Math.max(2, Math.round(fontSize * 0.18)));

      wrapped.forEach((text, i) => {
        const y = boxY + pad + i * lineH;
        ctx.fillStyle = i === 0 ? "#f0d000" : i < 4 ? "#e8efe9" : "#cfcfcf";
        if (text.indexOf("Место:") === 0) ctx.fillStyle = "#3dcf7a";
        ctx.fillText(text, pad, y, maxTextW);
      });
      ctx.restore();
    }

    function currentStampMeta(overrides) {
      const base = {
        tapeColor: els.tapeSelect.value,
        location: els.locationSelect.value,
        note: els.noteInput.value,
        time: new Date().toISOString(),
        geo: currentGeo,
        address: streetOnlyAddress(currentAddress)
      };
      return Object.assign(base, overrides || {});
    }

    async function bakePhoto(raw, strokes, meta) {
      if (!raw) return "";
      const img = await loadImageElement(raw);
      const imgW = img.naturalWidth || img.width;
      const imgH = img.naturalHeight || img.height;
      const canvas = document.createElement("canvas");
      canvas.width = imgW;
      canvas.height = imgH;
      const ctx = canvas.getContext("2d");
      ctx.drawImage(img, 0, 0, imgW, imgH);

      (strokes || []).forEach((stroke) => {
        if (!stroke.points || !stroke.points.length) return;
        const mapped = strokePointsToImage(stroke, imgW, imgH);
        if (!mapped.length) return;
        ctx.save();
        ctx.lineCap = "round";
        ctx.lineJoin = "round";
        ctx.strokeStyle = stroke.color || "#3dcf7a";
        ctx.lineWidth = Math.max(1, strokeLineWidthImg(stroke, imgW, imgH));
        ctx.beginPath();
        ctx.moveTo(mapped[0].x, mapped[0].y);
        for (let i = 1; i < mapped.length; i++) ctx.lineTo(mapped[i].x, mapped[i].y);
        if (mapped.length === 1) ctx.lineTo(mapped[0].x + 0.5, mapped[0].y);
        ctx.stroke();
        ctx.restore();
      });

      paintStamp(ctx, imgW, imgH, meta);

      try {
        return canvas.toDataURL("image/jpeg", 0.72);
      } catch (_) {
        return raw;
      }
    }

    function strokePointsToImage(stroke, imgW, imgH) {
      const pts = stroke.points || [];
      if (stroke.space === "img") {
        return pts.map((p) => ({
          x: p.x * imgW,
          y: p.y * imgH
        }));
      }
      // legacy: координаты были от viewport 720×960 — переводим через contain
      const vw = stroke.viewW || 720;
      const vh = stroke.viewH || 960;
      return pts.map((p) => mapContainPoint(p.x, p.y, imgW, imgH, vw, vh));
    }

    function strokeLineWidthImg(stroke, imgW, imgH) {
      if (stroke.widthImg != null && isFinite(stroke.widthImg)) {
        return Number(stroke.widthImg);
      }
      if (stroke.space === "img") {
        // width в CSS px при типичной ширине кадра ~360css → грубый масштаб
        return Math.max(1, (Number(stroke.width) || drawWidthPx) * (imgW / 360));
      }
      const vw = stroke.viewW || 720;
      const vh = stroke.viewH || 960;
      const contain = getContainRect(imgW, imgH, vw, vh);
      return Math.max(1, (Number(stroke.width) || drawWidthPx) / Math.max(contain.scale, 0.0001));
    }

    async function rebakeAllPhotos(photos, meta) {
      const out = [];
      for (let i = 0; i < photos.length; i++) {
        const p = photos[i];
        let raw = p.raw || p.final || "";
        if (!raw) continue;
        try {
          raw = await compressImage(raw, 960, 0.68);
        } catch (_) { /* keep */ }
        const final = await bakePhoto(raw, p.strokes || [], meta);
        out.push({
          id: p.id || uid("p"),
          raw: raw,
          strokes: Array.isArray(p.strokes) ? p.strokes : [],
          final: final
        });
      }
      return out;
    }

    /* ── Stage (fullscreen static camera + draw) ── */

    function lockBodyScroll() {
      bodyScrollY = window.scrollY || window.pageYOffset || 0;
      document.body.classList.add("stage-lock");
      document.body.style.top = "-" + bodyScrollY + "px";
    }

    function unlockBodyScroll() {
      document.body.classList.remove("stage-lock");
      document.body.style.top = "";
      window.scrollTo(0, bodyScrollY || 0);
    }

    function setStageMode(mode) {
      els.stage.classList.toggle("mode-camera", mode === "camera");
      els.stage.classList.toggle("mode-draw", mode === "draw");
      if (els.stageHint) els.stageHint.textContent = "";
    }

    function stopCamera() {
      if (mediaStream) {
        mediaStream.getTracks().forEach((t) => t.stop());
        mediaStream = null;
      }
      els.stageVideo.srcObject = null;
      els.stageVideo.classList.add("hidden");
      els.stage.classList.remove("streaming");
    }

    function updateDrawButtons() {
      const has = stageStrokes.length > 0;
      els.btnUndoDraw.disabled = !has;
      els.btnClearDraw.disabled = !has;
      if (els.drawSizeLabel) {
        els.drawSizeLabel.textContent = String(drawWidthPx);
      }
    }

    function getStageContainLayout() {
      const viewport = els.stageViewport.getBoundingClientRect();
      const viewW = Math.max(1, viewport.width);
      const viewH = Math.max(1, viewport.height);
      const imgW = Math.max(1, stageImgSize.w);
      const imgH = Math.max(1, stageImgSize.h);
      const contain = getContainRect(imgW, imgH, viewW, viewH);
      return {
        viewW: viewW,
        viewH: viewH,
        imgW: imgW,
        imgH: imgH,
        scale: contain.scale,
        offsetX: contain.offsetX,
        offsetY: contain.offsetY,
        drawnW: contain.drawnW,
        drawnH: contain.drawnH
      };
    }

    function paintStrokeOnCtx(ctx, stroke, canvas) {
      if (!stroke || !stroke.points || !stroke.points.length) return;
      const layout = getStageContainLayout();
      const dpr = canvas.width / layout.viewW;
      const ox = layout.offsetX * dpr;
      const oy = layout.offsetY * dpr;
      const dw = layout.drawnW * dpr;
      const dh = layout.drawnH * dpr;

      ctx.save();
      ctx.lineCap = "round";
      ctx.lineJoin = "round";
      ctx.strokeStyle = stroke.color || "#3dcf7a";

      let pts;
      if (stroke.space === "img") {
        pts = stroke.points.map((p) => ({
          x: ox + p.x * dw,
          y: oy + p.y * dh
        }));
        const widthImg = stroke.widthImg != null
          ? Number(stroke.widthImg)
          : (Number(stroke.width) || drawWidthPx) / Math.max(layout.scale, 0.0001);
        ctx.lineWidth = Math.max(1, widthImg * layout.scale * dpr);
      } else {
        // legacy viewport-normalized
        pts = stroke.points.map((p) => ({
          x: p.x * canvas.width,
          y: p.y * canvas.height
        }));
        ctx.lineWidth = Math.max(1, (Number(stroke.width) || drawWidthPx) * dpr);
      }

      ctx.beginPath();
      ctx.moveTo(pts[0].x, pts[0].y);
      for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i].x, pts[i].y);
      if (pts.length === 1) ctx.lineTo(pts[0].x + 0.01, pts[0].y);
      ctx.stroke();
      ctx.restore();
    }

    function paintStampOnStage(ctx, canvas, meta) {
      const layout = getStageContainLayout();
      const dpr = canvas.width / layout.viewW;
      const ox = layout.offsetX * dpr;
      const oy = layout.offsetY * dpr;
      const dw = layout.drawnW * dpr;
      const dh = layout.drawnH * dpr;
      ctx.save();
      ctx.beginPath();
      ctx.rect(ox, oy, dw, dh);
      ctx.clip();
      ctx.translate(ox, oy);
      paintStamp(ctx, dw, dh, meta);
      ctx.restore();
    }

    function redrawStageCanvas() {
      const canvas = els.stageCanvas;
      const ctx = canvas.getContext("2d");
      if (!ctx) return;
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      stageStrokes.forEach((s) => paintStrokeOnCtx(ctx, s, canvas));
      if (stageCurrent) paintStrokeOnCtx(ctx, stageCurrent, canvas);
      if (stageRaw) paintStampOnStage(ctx, canvas, currentStampMeta());
    }

    function resizeStageCanvas() {
      const canvas = els.stageCanvas;
      const viewport = els.stageViewport;
      if (!viewport) return;
      const rect = viewport.getBoundingClientRect();
      const dpr = Math.min(window.devicePixelRatio || 1, 2);
      const w = Math.max(1, Math.round(rect.width * dpr));
      const h = Math.max(1, Math.round(rect.height * dpr));
      if (canvas.width !== w || canvas.height !== h) {
        canvas.width = w;
        canvas.height = h;
      }
      canvas.style.width = rect.width + "px";
      canvas.style.height = rect.height + "px";
      canvas.style.left = "0";
      canvas.style.top = "0";
      redrawStageCanvas();
    }

    function pointerToImageNorm(e) {
      const rect = els.stageCanvas.getBoundingClientRect();
      const clientX = e.clientX != null ? e.clientX : (e.touches && e.touches[0] && e.touches[0].clientX);
      const clientY = e.clientY != null ? e.clientY : (e.touches && e.touches[0] && e.touches[0].clientY);
      if (clientX == null || clientY == null || !rect.width || !rect.height) return null;
      const layout = getStageContainLayout();
      if (layout.drawnW < 1 || layout.drawnH < 1) return null;
      const vx = clientX - rect.left;
      const vy = clientY - rect.top;
      return {
        x: Math.min(1, Math.max(0, (vx - layout.offsetX) / layout.drawnW)),
        y: Math.min(1, Math.max(0, (vy - layout.offsetY) / layout.drawnH))
      };
    }

    function onDrawStart(e) {
      if (!stageRaw || !stageOpen) return;
      e.preventDefault();
      e.stopPropagation();
      const p = pointerToImageNorm(e);
      if (!p) return;
      const layout = getStageContainLayout();
      isDrawing = true;
      stageCurrent = {
        color: drawColor,
        width: drawWidthPx,
        widthImg: Math.max(1, drawWidthPx / Math.max(layout.scale, 0.0001)),
        space: "img",
        points: [p]
      };
      try { els.stageCanvas.setPointerCapture(e.pointerId); } catch (_) { /* ignore */ }
      redrawStageCanvas();
    }

    function onDrawMove(e) {
      if (!isDrawing || !stageCurrent) return;
      e.preventDefault();
      e.stopPropagation();
      const p = pointerToImageNorm(e);
      if (!p) return;
      const last = stageCurrent.points[stageCurrent.points.length - 1];
      const dx = p.x - last.x;
      const dy = p.y - last.y;
      if (dx * dx + dy * dy < 0.00002) return;
      stageCurrent.points.push(p);
      redrawStageCanvas();
    }

    function onDrawEnd(e) {
      if (!isDrawing) return;
      e.preventDefault();
      e.stopPropagation();
      isDrawing = false;
      if (stageCurrent && stageCurrent.points.length) stageStrokes.push(stageCurrent);
      stageCurrent = null;
      redrawStageCanvas();
      updateDrawButtons();
      haptic("light");
    }

    function preventStageScroll(e) {
      if (!stageOpen) return;
      // не блокируем ползунок толщины и кнопки
      if (e.target && e.target.closest && e.target.closest(".stage-bar")) return;
      e.preventDefault();
    }

    async function openStage(options) {
      options = options || {};
      if (options.editIndex == null && formPhotos.length >= MAX_PHOTOS) {
        showToast("max " + MAX_PHOTOS);
        return;
      }

      editingPhotoIdx = options.editIndex != null ? options.editIndex : null;
      stageOpen = true;
      stageRaw = "";
      stageStrokes = [];
      stageCurrent = null;
      isDrawing = false;
      lockBodyScroll();
      setVerticalSwipes(false);
      requestStageFullscreen();
      els.stage.classList.add("open");
      els.stage.setAttribute("aria-hidden", "false");
      updateDrawButtons();
      if (tg && tg.BackButton) tg.BackButton.show();

      if (editingPhotoIdx != null && formPhotos[editingPhotoIdx]) {
        const photo = formPhotos[editingPhotoIdx];
        enterDrawMode(photo.raw || photo.final || "", photo.strokes || []);
        return;
      }

      setStageMode("camera");
      els.stageImage.classList.add("hidden");
      els.stageIdle.classList.remove("hidden");
      await startCamera();
    }

    function closeStage() {
      stopCamera();
      stageOpen = false;
      stageRaw = "";
      stageStrokes = [];
      stageCurrent = null;
      isDrawing = false;
      editingPhotoIdx = null;
      els.stage.classList.remove("open", "streaming");
      els.stage.setAttribute("aria-hidden", "true");
      els.stageImage.removeAttribute("src");
      els.stageImage.classList.add("hidden");
      setVerticalSwipes(true);
      exitStageFullscreen();
      unlockBodyScroll();
      if (
        tg &&
        tg.BackButton &&
        !els.formOverlay.classList.contains("open") &&
        !els.menuOverlay.classList.contains("open") &&
        !els.settingsOverlay.classList.contains("open")
      ) {
        tg.BackButton.hide();
      }
    }

    async function startCamera() {
      setStageMode("camera");
      els.stageImage.classList.add("hidden");
      els.stageIdle.classList.remove("hidden");
      if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
        els.photoInput.click();
        return;
      }
      try {
        stopCamera();
        mediaStream = await navigator.mediaDevices.getUserMedia({
          audio: false,
          video: {
            facingMode: { ideal: "environment" },
            width: { ideal: 1280 },
            height: { ideal: 960 }
          }
        });
        els.stageVideo.srcObject = mediaStream;
        await els.stageVideo.play();
        els.stage.classList.add("streaming");
        els.stageVideo.classList.remove("hidden");
        els.stageIdle.classList.add("hidden");
        haptic("light");
      } catch (_) {
        showToast("нет камеры");
        els.photoInput.click();
      }
    }

    function enterDrawMode(dataUrl, strokes) {
      stageRaw = dataUrl;
      stageStrokes = Array.isArray(strokes) ? strokes.slice() : [];
      stageCurrent = null;
      stopCamera();
      els.stageVideo.classList.add("hidden");
      els.stageIdle.classList.add("hidden");
      els.stageImage.onload = () => {
        stageImgSize = {
          w: els.stageImage.naturalWidth || 1,
          h: els.stageImage.naturalHeight || 1
        };
        resizeStageCanvas();
        redrawStageCanvas();
      };
      els.stageImage.src = dataUrl;
      els.stageImage.classList.remove("hidden");
      if (els.stageImage.complete && els.stageImage.naturalWidth) {
        stageImgSize = {
          w: els.stageImage.naturalWidth,
          h: els.stageImage.naturalHeight
        };
      }
      setStageMode("draw");
      if (els.drawSize) els.drawSize.value = String(drawWidthPx);
      updateDrawButtons();
      requestAnimationFrame(() => {
        resizeStageCanvas();
        redrawStageCanvas();
      });
    }

    function flashCaptureFeedback() {
      const flash = document.createElement("div");
      flash.style.cssText =
        "position:absolute;inset:0;background:#fff;opacity:0.55;z-index:5;pointer-events:none;";
      els.stageViewport.appendChild(flash);
      setTimeout(() => flash.remove(), 120);
    }

    async function addQuickPhoto(dataUrl) {
      const compressed = await compressImage(dataUrl, 960, 0.65);
      formPhotos.push({
        id: uid("p"),
        raw: compressed,
        strokes: [],
        final: compressed
      });
      renderPhotosGrid();
      if (!saveDraft()) {
        // draft overflow — still keep in memory
      }
      showToast(formPhotos.length + "/" + MAX_PHOTOS);
      haptic("ok");
    }

    function capturePhoto() {
      if (formPhotos.length >= MAX_PHOTOS && editingPhotoIdx == null) {
        showToast("max " + MAX_PHOTOS);
        return;
      }
      const video = els.stageVideo;
      if (!mediaStream || !video.videoWidth) {
        // fallback: системная камера / галерея
        els.photoInput.click();
        return;
      }
      const canvas = document.createElement("canvas");
      canvas.width = video.videoWidth;
      canvas.height = video.videoHeight;
      const ctx = canvas.getContext("2d");
      ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
      let dataUrl;
      try {
        dataUrl = canvas.toDataURL("image/jpeg", 0.8);
      } catch (_) {
        showToast("fail");
        return;
      }
      flashCaptureFeedback();
      // быстрый режим: сразу в галерею формы, камера продолжает работать
      addQuickPhoto(dataUrl).then(() => {
        if (formPhotos.length >= MAX_PHOTOS) {
          showToast("max 5");
        }
      });
    }

    async function finishStagePhoto() {
      // В режиме рисования — сохранить обводку в выбранное/текущее фото
      if (!stageRaw) {
        showToast("нет фото");
        return;
      }

      if (editingPhotoIdx != null && formPhotos[editingPhotoIdx]) {
        formPhotos[editingPhotoIdx] = {
          id: formPhotos[editingPhotoIdx].id || uid("p"),
          raw: stageRaw,
          strokes: stageStrokes.slice(),
          final: stageRaw
        };
        closeStage();
        renderPhotosGrid();
        saveDraft();
        showToast("ok");
        haptic("ok");
        return;
      }

      // если открыли draw без editIndex (fallback) — добавить как новое
      formPhotos.push({
        id: uid("p"),
        raw: stageRaw,
        strokes: stageStrokes.slice(),
        final: stageRaw
      });
      closeStage();
      renderPhotosGrid();
      saveDraft();
      showToast(formPhotos.length + "/" + MAX_PHOTOS);
      haptic("ok");
    }

    /* ── Form photos UI ── */

    function renderPhotosGrid() {
      els.photosGrid.innerHTML = formPhotos.map((p, idx) => {
        const src = p.final || p.raw || "";
        return (
          '<div class="photo-thumb" data-idx="' + idx + '">' +
            '<img src="' + escapeAttr(src) + '" alt="Фото ' + (idx + 1) + '" />' +
            '<button type="button" class="btn-remove-photo" data-remove="' + idx + '" aria-label="Удалить">×</button>' +
          "</div>"
        );
      }).join("");
      els.btnAddPhoto.disabled = formPhotos.length >= MAX_PHOTOS;
      els.photosHint.textContent = formPhotos.length + " / " + MAX_PHOTOS;
    }

    function updateHeavyAlert() {
      const w = Number(els.weightSelect.value);
      els.heavyAlert.classList.toggle("show", w > HEAVY_WEIGHT_G);
    }

    /* ── Draft ── */

    function saveDraft() {
      if (suppressDraft) return true;
      if (!els.formOverlay.classList.contains("open")) return true;
      const draft = {
        editingId: editingId,
        location: els.locationSelect.value,
        weight: els.weightSelect.value,
        tapeColor: els.tapeSelect.value,
        note: els.noteInput.value,
        photos: formPhotos,
        geo: currentGeo,
        address: currentAddress
      };
      return saveJSON(STORAGE_DRAFT, draft);
    }

    function clearDraft() {
      localStorage.removeItem(STORAGE_DRAFT);
    }

    function loadDraftIntoForm() {
      const draft = loadJSON(STORAGE_DRAFT, null);
      if (!draft) return false;
      editingId = draft.editingId || null;
      els.locationSelect.value = draft.location || "warehouse_1";
      els.weightSelect.value = draft.weight != null ? String(draft.weight) : "0.5";
      els.tapeSelect.value = draft.tapeColor || "yellow";
      els.noteInput.value = draft.note || "";
      formPhotos = Array.isArray(draft.photos)
        ? draft.photos.map(migratePhoto).filter(Boolean)
        : [];
      if (draft.geo) {
        currentGeo = normalizeFix(Object.assign({}, draft.geo, { source: draft.geo.source || "browser" }));
        if (currentGeo) geoSamples = [currentGeo];
      }
      currentAddress = streetOnlyAddress(draft.address || (currentGeo && currentGeo.address) || "");
      if (currentGeo && currentAddress) {
        lastAddressCoords = { lat: currentGeo.latitude, lon: currentGeo.longitude };
      }
      els.formTitle.textContent = editingId ? "Редактирование" : "Новая позиция";
      updateHeavyAlert();
      renderGeoUi();
      renderPhotosGrid();
      return true;
    }

    function resetForm(defaults) {
      els.itemForm.reset();
      els.photoInput.value = "";
      formPhotos = [];
      editingId = null;
      stopGeoWatch();
      currentGeo = null;
      geoSamples = [];
      geoBusy = false;
      currentAddress = "";
      lastAddressCoords = null;
      renderGeoUi();
      renderPhotosGrid();
      els.formTitle.textContent = "Новая позиция";
      if (defaults) {
        if (defaults.location) els.locationSelect.value = defaults.location;
        if (defaults.weight != null) els.weightSelect.value = String(defaults.weight);
        if (defaults.tapeColor) els.tapeSelect.value = defaults.tapeColor;
        if (defaults.note != null) els.noteInput.value = defaults.note;
      }
      updateHeavyAlert();
    }

    function openForm(options) {
      options = options || {};
      suppressDraft = true;
      resetForm();

      if (options.editItem) {
        const item = options.editItem;
        editingId = item.id;
        els.formTitle.textContent = "Редактирование";
        els.locationSelect.value = item.location || "warehouse_1";
        els.weightSelect.value = String(item.weight != null ? item.weight : "0.5");
        els.tapeSelect.value = item.tapeColor || "yellow";
        els.noteInput.value = item.note || "";
        formPhotos = (item.photos || []).map(migratePhoto).filter(Boolean);
        if (item.geo) {
          currentGeo = normalizeFix(Object.assign({}, item.geo, { source: item.geo.source || "browser" }));
          if (currentGeo) {
            geoSamples = [currentGeo];
            currentAddress = streetOnlyAddress(item.geo.address || "");
            if (currentAddress) {
              lastAddressCoords = { lat: currentGeo.latitude, lon: currentGeo.longitude };
            }
          }
        }
        renderPhotosGrid();
        updateHeavyAlert();
        renderGeoUi();
      } else if (options.repeatLast) {
        const last = loadJSON(STORAGE_LAST, null);
        if (last) {
          resetForm({
            location: last.location,
            weight: last.weight,
            tapeColor: last.tapeColor,
            note: last.note
          });
          showToast("повтор — фото");
        }
      } else if (options.useDraft !== false) {
        const restored = loadDraftIntoForm();
        if (restored) showToast("draft");
      }

      suppressDraft = false;
      openOverlay(els.formOverlay);
      haptic("light");
      acquirePreciseGeo({ keepBest: !!currentGeo });
    }

    function closeForm(saveDraftFlag) {
      if (saveDraftFlag) saveDraft();
      if (stageOpen) closeStage();
      stopGeoWatch();
      geoBusy = false;
      closeOverlay(els.formOverlay);
    }

    function openSettings() {
      renderPriceSettings();
      closeOverlay(els.menuOverlay);
      openOverlay(els.settingsOverlay);
    }

    function renderPriceSettings() {
      const host = $("priceRows");
      if (!host) return;
      host.innerHTML = WEIGHTS.map((w) => {
        const key = weightKey(w);
        return (
          '<div class="price-row">' +
            "<span>" + escapeHtml(formatGrams(w)) + "</span>" +
            '<input type="number" id="price_' + escapeAttr(key) +
            '" min="0" step="1" inputmode="numeric" value="' +
            escapeAttr(String(itemPrice(w))) + '" />' +
          "</div>"
        );
      }).join("");
    }

    /* ── Export / sync ── */

    function exportCsv() {
      const headers = [
        "id", "location", "location_label", "weight_g", "tape_color", "price_rub", "revenue",
        "note", "photos_count", "created_at", "updated_at",
        "lat", "lon", "accuracy_m", "geo_source", "altitude_m", "address"
      ];
      const rows = items.map((item) => {
        const price = itemPrice(item.weight);
        const revenue = itemRevenue(item);
        const g = item.geo || {};
        return [
          item.id,
          item.location,
          locationLabel(item.location),
          item.weight,
          item.tapeColor || "",
          price,
          revenue,
          '"' + String(item.note || "").replace(/"/g, '""') + '"',
          (item.photos && item.photos.length) || 0,
          item.createdAt,
          item.updatedAt || "",
          g.latitude != null ? g.latitude : "",
          g.longitude != null ? g.longitude : "",
          g.accuracy != null ? g.accuracy : "",
          g.source || "",
          g.altitude != null ? g.altitude : "",
          '"' + String(g.address || "").replace(/"/g, '""') + '"'
        ].join(",");
      });
      const csv = "\uFEFF" + headers.join(",") + "\n" + rows.join("\n");
      const blob = new Blob([csv], { type: "text/csv;charset=utf-8" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = "logistics_export_" + new Date().toISOString().slice(0, 10) + ".csv";
      document.body.appendChild(a);
      a.click();
      a.remove();
      URL.revokeObjectURL(url);
      showToast("csv");
      haptic("ok");
    }

    function notifyBotMeta() {
      // sendData лимит ~4KB — только мета, без base64 фото
      const payload = {
        type: "logistics_sync",
        exportedAt: new Date().toISOString(),
        prices: prices,
        stats: computeStats(),
        items: items.map((i) => ({
          id: i.id,
          location: i.location,
          weight: i.weight,
          tapeColor: i.tapeColor,
          note: i.note,
          createdAt: i.createdAt,
          updatedAt: i.updatedAt,
          photoCount: (i.photos && i.photos.length) || 0,
          geo: i.geo || null
        }))
      };
      const data = JSON.stringify(payload);
      if (tg && typeof tg.sendData === "function") {
        try {
          tg.sendData(data);
          return true;
        } catch (_) { /* ignore */ }
      }
      return false;
    }

    async function syncToServer(options) {
      options = options || {};
      if (!items.length) {
        if (!options.silent) showToast("пусто");
        return false;
      }
      const userId =
        (tg && tg.initDataUnsafe && tg.initDataUnsafe.user && tg.initDataUnsafe.user.id) || 0;
      if (!userId) {
        if (!options.silent) showToast("no userId", true);
        return false;
      }

      if (!options.silent) showToast("sync…");
      const payload = {
        userId: userId,
        items: items.map((i) => ({
          id: i.id,
          location: i.location,
          weight: i.weight,
          tapeColor: i.tapeColor,
          note: i.note,
          geo: i.geo || null,
          createdAt: i.createdAt,
          updatedAt: i.updatedAt,
          photos: (i.photos || []).map((p) => ({
            id: p.id,
            final: p.final || p.raw || ""
          }))
        }))
      };

      try {
        const res = await fetch("/api/sync-items", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload)
        });
        const data = await res.json().catch(() => ({}));
        if (!res.ok || !data.ok) {
          if (!options.silent) {
            showToast("sync fail", true);
            haptic("warn");
          }
          return false;
        }
        if (!options.silent) {
          showToast("sync " + (data.saved || 0) + " +foto");
          haptic("ok");
        }
        if (options.notifyBot) notifyBotMeta();
        return true;
      } catch (_) {
        if (!options.silent) {
          showToast("offline", true);
          haptic("warn");
        }
        return false;
      }
    }

    async function sendDataToBot() {
      // фото уходят на сервер через /api/sync-items, мета — sendData
      const ok = await syncToServer({ notifyBot: true });
      if (!ok) return;
    }

    /* ── Events ── */

    els.btnAdd.addEventListener("click", () => openForm({ useDraft: true }));
    els.btnRepeat.addEventListener("click", () => {
      if (els.btnRepeat.disabled) return;
      openForm({ repeatLast: true, useDraft: false });
    });

    els.btnCloseForm.addEventListener("click", () => closeForm(true));
    els.btnCancelForm.addEventListener("click", () => closeForm(true));

    els.btnMenu.addEventListener("click", () => openOverlay(els.menuOverlay));
    els.btnCloseMenu.addEventListener("click", () => closeOverlay(els.menuOverlay));
    els.btnOpenSettings.addEventListener("click", openSettings);
    els.btnCloseSettings.addEventListener("click", () => closeOverlay(els.settingsOverlay));

    els.btnSaveSettings.addEventListener("click", () => {
      const next = {};
      WEIGHTS.forEach((w) => {
        const key = weightKey(w);
        const input = $("price_" + key);
        next[key] = Math.max(0, Number(input && input.value) || 0);
      });
      prices = next;
      saveJSON(STORAGE_PRICES, prices);
      closeOverlay(els.settingsOverlay);
      renderAll();
      showToast("ok");
      haptic("ok");
    });

    els.btnExportCsv.addEventListener("click", () => {
      closeOverlay(els.menuOverlay);
      if (!items.length) {
        showToast("пусто");
        return;
      }
      exportCsv();
    });

    els.btnSyncServer.addEventListener("click", () => {
      closeOverlay(els.menuOverlay);
      syncToServer({ notifyBot: false });
    });

    els.btnSendToBot.addEventListener("click", () => {
      closeOverlay(els.menuOverlay);
      sendDataToBot();
    });

    els.btnCloseApp.addEventListener("click", () => {
      if (tg && typeof tg.close === "function") tg.close();
      else showToast("tg only");
    });

    els.filterChips.addEventListener("click", (e) => {
      const btn = e.target.closest("[data-filter]");
      if (!btn) return;
      activeFilter = btn.getAttribute("data-filter") || "all";
      renderFilters();
      renderList();
      haptic("light");
    });

    els.itemsList.addEventListener("click", (e) => {
      const btn = e.target.closest("[data-action]");
      if (!btn) return;
      const card = btn.closest(".card");
      if (!card) return;
      const id = card.getAttribute("data-id");
      const action = btn.getAttribute("data-action");

      if (action === "delete") {
        items = items.filter((i) => i.id !== id);
        saveItemsPersistent(items);
        renderAll();
        showToast("удалено");
        haptic("light");
        return;
      }

      if (action === "edit") {
        const item = items.find((i) => i.id === id);
        if (!item) return;
        openForm({ editItem: item, useDraft: false });
      }
    });

    els.photosGrid.addEventListener("click", (e) => {
      const btn = e.target.closest("[data-remove]");
      if (btn) {
        const idx = Number(btn.getAttribute("data-remove"));
        if (!isFinite(idx)) return;
        formPhotos.splice(idx, 1);
        renderPhotosGrid();
        saveDraft();
        haptic("light");
        return;
      }
      const thumb = e.target.closest(".photo-thumb[data-idx]");
      if (!thumb) return;
      const idx = Number(thumb.getAttribute("data-idx"));
      if (!isFinite(idx) || !formPhotos[idx]) return;
      openStage({ editIndex: idx });
    });

    els.btnAddPhoto.addEventListener("click", () => openStage());

    els.weightSelect.addEventListener("change", () => {
      updateHeavyAlert();
      const w = Number(els.weightSelect.value);
      if (w > HEAVY_WEIGHT_G) {
        showToast(">3г", true);
        haptic("warn");
      }
      saveDraft();
      if (stageOpen && stageRaw) redrawStageCanvas();
    });

    els.locationSelect.addEventListener("change", () => {
      saveDraft();
      if (stageOpen && stageRaw) redrawStageCanvas();
    });

    els.tapeSelect.addEventListener("change", () => {
      saveDraft();
      if (stageOpen && stageRaw) redrawStageCanvas();
    });

    els.noteInput.addEventListener("input", () => {
      saveDraft();
      if (stageOpen && stageRaw) redrawStageCanvas();
    });

    els.btnCapture.addEventListener("click", () => capturePhoto());
    if (els.btnFinishCam) {
      els.btnFinishCam.addEventListener("click", () => {
        closeStage();
      });
    }
    els.btnDoneDraw.addEventListener("click", () => finishStagePhoto());
    els.btnRetake.addEventListener("click", () => {
      stageStrokes = [];
      stageCurrent = null;
      isDrawing = false;
      redrawStageCanvas();
      updateDrawButtons();
      haptic("light");
    });
    els.btnCancelStage.addEventListener("click", () => closeStage());

    els.stageCanvas.addEventListener("pointerdown", onDrawStart, { passive: false });
    els.stageCanvas.addEventListener("pointermove", onDrawMove, { passive: false });
    els.stageCanvas.addEventListener("pointerup", onDrawEnd, { passive: false });
    els.stageCanvas.addEventListener("pointercancel", onDrawEnd, { passive: false });
    els.stage.addEventListener("touchmove", preventStageScroll, { passive: false });
    els.stage.addEventListener("wheel", preventStageScroll, { passive: false });

    els.drawColors.addEventListener("click", (e) => {
      const btn = e.target.closest("[data-color]");
      if (!btn) return;
      drawColor = btn.getAttribute("data-color") || "#3dcf7a";
      els.drawColors.querySelectorAll(".draw-color").forEach((el) => {
        el.classList.toggle("active", el === btn);
      });
    });

    els.drawSize.addEventListener("input", () => {
      drawWidthPx = Math.max(1, Number(els.drawSize.value) || 4);
      if (els.drawSizeLabel) els.drawSizeLabel.textContent = String(drawWidthPx);
    });
    els.drawSize.addEventListener("change", () => {
      drawWidthPx = Math.max(1, Number(els.drawSize.value) || 4);
      if (els.drawSizeLabel) els.drawSizeLabel.textContent = String(drawWidthPx);
    });

    els.btnUndoDraw.addEventListener("click", () => {
      stageStrokes.pop();
      redrawStageCanvas();
      updateDrawButtons();
    });

    els.btnClearDraw.addEventListener("click", () => {
      stageStrokes = [];
      stageCurrent = null;
      isDrawing = false;
      redrawStageCanvas();
      updateDrawButtons();
    });

    window.addEventListener("resize", () => {
      if (stageOpen && stageRaw) resizeStageCanvas();
    });

    els.photoInput.addEventListener("change", async () => {
      const file = els.photoInput.files && els.photoInput.files[0];
      els.photoInput.value = "";
      if (!file) return;
      if (!file.type.startsWith("image/")) {
        showToast("нужно фото");
        return;
      }
      try {
        const raw = await readFileAsDataURL(file);
        const compressed = await compressImage(raw, 960, 0.65);
        if (editingPhotoIdx != null) {
          if (!stageOpen) await openStage({ editIndex: editingPhotoIdx });
          enterDrawMode(compressed, []);
          haptic("ok");
          return;
        }
        if (!stageOpen) {
          stageOpen = true;
          lockBodyScroll();
          setVerticalSwipes(false);
          els.stage.classList.add("open");
          els.stage.setAttribute("aria-hidden", "false");
          setStageMode("camera");
        }
        await addQuickPhoto(compressed);
      } catch (_) {
        showToast("fail");
      }
    });

    els.btnRefreshGeo.addEventListener("click", () => {
      acquirePreciseGeo({ keepBest: false });
      haptic("light");
    });

    els.btnGeoSettings.addEventListener("click", () => openTelegramGeoSettings());

    els.itemForm.addEventListener("submit", async (e) => {
      e.preventDefault();

      if (!formPhotos.length) {
        showToast("нужно фото");
        haptic("warn");
        return;
      }
      if (!currentGeo) {
        showToast("нужен GPS");
        haptic("warn");
        acquirePreciseGeo({ keepBest: false });
        return;
      }
      if (currentGeo.accuracy > GEO_ACCEPTABLE_M) {
        showToast("GPS слабо", true);
        haptic("warn");
        return;
      }

      els.btnSaveItem.disabled = true;
      const weight = Number(els.weightSelect.value);
      const now = new Date().toISOString();
      const meta = currentStampMeta({ time: now });

      let bakedPhotos;
      try {
        bakedPhotos = await rebakeAllPhotos(formPhotos, meta);
      } catch (_) {
        bakedPhotos = formPhotos;
      }

      const geoPayload = {
        latitude: currentGeo.latitude,
        longitude: currentGeo.longitude,
        accuracy: currentGeo.accuracy,
        altitude: currentGeo.altitude,
        source: currentGeo.source,
        timestamp: currentGeo.timestamp,
        address: currentAddress || ""
      };

      if (editingId) {
        const idx = items.findIndex((i) => i.id === editingId);
        if (idx >= 0) {
          items[idx] = Object.assign({}, items[idx], {
            location: els.locationSelect.value,
            weight: weight,
            tapeColor: els.tapeSelect.value,
            note: (els.noteInput.value || "").trim(),
            photos: bakedPhotos,
            geo: geoPayload,
            updatedAt: now
          });
        }
      } else {
        items.push({
          id: uid("i"),
          location: els.locationSelect.value,
          weight: weight,
          tapeColor: els.tapeSelect.value,
          note: (els.noteInput.value || "").trim(),
          photos: bakedPhotos,
          geo: geoPayload,
          createdAt: now,
          updatedAt: now
        });
      }

      if (!saveItemsPersistent(items)) {
        els.btnSaveItem.disabled = false;
        return;
      }
      saveJSON(STORAGE_LAST, {
        location: els.locationSelect.value,
        weight: weight,
        tapeColor: els.tapeSelect.value,
        note: (els.noteInput.value || "").trim()
      });
      clearDraft();

      const wasEdit = !!editingId;
      suppressDraft = true;
      resetForm();
      suppressDraft = false;
      closeOverlay(els.formOverlay);
      els.btnSaveItem.disabled = false;
      renderAll();

      if (weight > HEAVY_WEIGHT_G) {
        showToast("ok · >3г", true);
        haptic("warn");
      } else {
        showToast(wasEdit ? "updated" : "saved");
        haptic("ok");
      }
      // фото на сервер сразу после сохранения
      syncToServer({ silent: true, notifyBot: false });
    });

    [els.formOverlay, els.menuOverlay, els.settingsOverlay].forEach((overlay) => {
      overlay.addEventListener("click", (e) => {
        if (e.target !== overlay) return;
        if (overlay === els.formOverlay) closeForm(true);
        else closeOverlay(overlay);
      });
    });

    if (tg && tg.BackButton) {
      tg.BackButton.onClick(() => {
        if (stageOpen) {
          closeStage();
          return;
        }
        if (els.formOverlay.classList.contains("open")) {
          closeForm(true);
          return;
        }
        if (els.settingsOverlay.classList.contains("open")) {
          closeOverlay(els.settingsOverlay);
          return;
        }
        if (els.menuOverlay.classList.contains("open")) {
          closeOverlay(els.menuOverlay);
        }
      });
    }

    /* ── Init ── */

    initTelegram();
    items = loadItems();
    const storedPrices = loadJSON(STORAGE_PRICES, {});
    prices = {};
    WEIGHTS.forEach((w) => {
      const key = weightKey(w);
      const raw = storedPrices && storedPrices[key];
      prices[key] = raw != null ? Math.max(0, Number(raw) || 0) : DEFAULT_PRICES[key];
    });
    renderAll();
  })();
  </script>
</body>
</html>
